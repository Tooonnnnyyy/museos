<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwarmAgentOS Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#11120f;--ink-raised:#191a17;--page:#fff;--paper:#f3efe3;--bone:#fffdf7;
  --lime:#d9ff43;--flame:#ff5a36;--violet:#b7a7ff;--mint:#75ded1;--cobalt:#2864ff;--mute:#d8d8d2;
  --soft:color-mix(in srgb,var(--ink) 60%,transparent);
  --font-text:"Manrope","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --font-label:"DM Mono","PingFang SC",ui-monospace,monospace;
  --rule:2px solid var(--ink);--hair:1px solid color-mix(in srgb,var(--ink) 18%,transparent);
  --focus:var(--ink);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 1rem/1.5 var(--font-text);overflow-x:hidden}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}

/* shell: top bar + left rail */
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
.top{grid-column:1/-1;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:12px 20px;background:var(--ink);color:var(--bone);border-bottom:var(--rule)}
.top .brand{display:flex;align-items:center;gap:10px;font-weight:600;text-decoration:none}
.mark{width:30px;height:30px;display:grid;place-items:center;background:var(--lime);color:var(--ink);border:2px solid var(--bone);transform:rotate(-4deg);font:500 .9rem/1 var(--font-label)}
.top .crumb{font:400 .78rem/1.5 var(--font-label);color:var(--mute)}
.range{display:inline-flex;border:2px solid var(--bone);border-radius:999px;overflow:hidden}
.range button{padding:6px 14px;border:0;border-right:2px solid var(--bone);background:transparent;color:var(--bone);font:400 .74rem/1.5 var(--font-label);cursor:pointer}
.range button:last-child{border-right:0}
.range button[aria-pressed="true"]{background:var(--lime);color:var(--ink)}

.rail{position:sticky;top:57px;align-self:start;padding:20px 16px;border-right:var(--hair);height:calc(100vh - 57px)}
.rail a{display:block;padding:9px 12px;border-radius:8px;text-decoration:none;font:400 .8rem/1.5 var(--font-label);color:var(--soft)}
.rail a:hover{background:var(--paper);color:var(--ink)}
.rail a.active{background:var(--lime);color:var(--ink)}
.rail .rail-title{font:400 .66rem/1.5 var(--font-label);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:18px 12px 6px}

.main{padding:28px 32px 64px;min-width:0}
.section{padding-block:28px;border-bottom:var(--hair)}
.section:last-child{border-bottom:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px}
.sec-head h2{font-size:1.35rem;letter-spacing:-.02em}
.sec-head .meta{font:400 .72rem/1.5 var(--font-label);color:var(--soft)}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{border:var(--rule);background:var(--bone);padding:16px;box-shadow:4px 4px 0 var(--ink)}
.kpi .k-label{font:400 .7rem/1.5 var(--font-label);text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
.kpi .k-value{font:600 clamp(1.5rem,3vw,2.1rem)/1.1 var(--font-label);margin-top:8px;overflow-wrap:anywhere}
.kpi .k-delta{margin-top:8px;font:400 .72rem/1.5 var(--font-label)}
.k-delta.up{color:var(--mint)}.k-delta.down{color:var(--flame)}.k-delta.flat{color:var(--soft)}

/* chart */
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:18px;margin-top:10px;font:400 .72rem/1.5 var(--font-label);color:var(--soft)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px;vertical-align:-1px}
.legend .l-cost i{background:var(--flame)}.legend .l-runs i{background:var(--lime)}

/* funnel */
.funnel{display:flex;flex-direction:column;gap:8px;max-width:640px}
.f-step{display:grid;grid-template-columns:130px 1fr 56px;align-items:center;gap:14px;font:400 .78rem/1.5 var(--font-label)}
.f-step .bar{height:26px;background:var(--violet);border:1px solid var(--ink)}
.f-step .n{text-align:right}

/* tables */
.scroll{overflow-x:auto;border:var(--rule);background:var(--bone)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font:400 .7rem/1.4 var(--font-label);text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:11px 14px;border-bottom:var(--rule);white-space:nowrap;background:var(--paper)}
td{padding:11px 14px;border-bottom:var(--hair);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border:var(--rule);border-radius:999px;font:400 .68rem/1.5 var(--font-label);text-transform:uppercase;letter-spacing:.05em}
.pill.ok{background:var(--lime)}.pill.bad{background:var(--flame)}.pill.warn{background:var(--violet)}
a.mono{font:400 .74rem/1.5 var(--font-label);text-decoration:none;border-bottom:1px solid currentColor}
a.mono:hover{background:var(--lime)}

/* council */
.council{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{border:var(--rule);background:var(--bone);padding:18px;box-shadow:4px 4px 0 var(--ink)}
.card h3{font-size:1rem;margin-bottom:10px}
.winbar{display:flex;height:28px;border:var(--rule);margin-top:12px;overflow:hidden}
.winbar .w{background:var(--mint)}.winbar .l{background:var(--flame)}.winbar .t{background:var(--mute)}
.win-key{display:flex;gap:16px;margin-top:10px;font:400 .7rem/1.5 var(--font-label);color:var(--soft);flex-wrap:wrap}
.win-key i{display:inline-block;width:10px;height:10px;margin-right:6px;border-radius:2px;vertical-align:-1px}
.win-key .kw i{background:var(--mint)}.win-key .kl i{background:var(--flame)}.win-key .kt i{background:var(--mute)}

/* empty state */
.empty{border:2px dashed var(--ink);background:var(--paper);padding:40px;text-align:center;color:var(--soft)}
.empty b{color:var(--ink)}

@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;display:flex;gap:6px;flex-wrap:wrap;border-right:0;border-bottom:var(--hair);padding:12px 16px}
  .rail .rail-title{display:none}.rail a{padding:6px 10px}
  .main{padding:20px 16px 48px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="/"><span class="mark">M</span><span>SwarmAgentOS</span><span class="crumb">/ analytics</span></a>
    <div class="range" role="group" aria-label="Date range">
      <button type="button" data-days="7">7d</button>
      <button type="button" data-days="28" aria-pressed="true">28d</button>
      <button type="button" data-days="90">90d</button>
    </div>
  </header>

  <nav class="rail" aria-label="Analytics sections">
    <a href="#overview" class="active" data-i18n="navOverview"></a>
    <a href="#council" data-i18n="navCouncil"></a>
    <a href="#models" data-i18n="navModels"></a>
    <a href="#runs" data-i18n="navRuns"></a>
  </nav>

  <main class="main">
    <section class="section" id="overview">
      <div class="sec-head">
        <h2 data-i18n="overview"></h2>
        <span class="meta" id="range-label"></span>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="chart" style="margin-top:24px">
        <div id="chart"></div>
        <div class="legend"><span class="l-cost"><i></i><span data-i18n="spend"></span></span><span class="l-runs"><i></i><span data-i18n="runs"></span></span></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;margin-top:28px">
        <div>
          <div class="sec-head"><h3 style="font-size:1rem" data-i18n="funnel"></h3></div>
          <div class="funnel" id="funnel"></div>
        </div>
        <div>
          <div class="sec-head"><h3 style="font-size:1rem" data-i18n="byRole"></h3></div>
          <div class="scroll"><table id="role-table"></table></div>
        </div>
      </div>
    </section>

    <section class="section" id="council">
      <div class="sec-head"><h2 data-i18n="council"></h2><span class="meta" data-i18n="councilHint"></span></div>
      <div class="council">
        <div class="card">
          <h3 data-i18n="verdict"></h3>
          <div id="verdict"></div>
          <div class="winbar" id="winbar"><div class="w" style="width:0"></div><div class="l" style="width:0"></div><div class="t" style="width:0"></div></div>
          <div class="win-key"><span class="kw"><i></i><span data-i18n="win"></span></span><span class="kl"><i></i><span data-i18n="loss"></span></span><span class="kt"><i></i><span data-i18n="tie"></span></span></div>
        </div>
        <div class="card">
          <h3 data-i18n="councilStats"></h3>
          <div id="council-stats"></div>
        </div>
      </div>
    </section>

    <section class="section" id="models">
      <div class="sec-head"><h2 data-i18n="models"></h2><span class="meta" data-i18n="modelsHint"></span></div>
      <div class="scroll"><table id="provider-table"></table></div>
    </section>

    <section class="section" id="runs">
      <div class="sec-head"><h2 data-i18n="runs"></h2><span class="meta" data-i18n="runsHint"></span></div>
      <div class="scroll"><table id="runs-table"></table></div>
    </section>
  </main>
</div>

<script>
"use strict";
const I18N = {
  en: {
    navOverview:"Overview", navCouncil:"Council score", navModels:"Models", navRuns:"Runs",
    overview:"Overview", spend:"Spend (USD)", runs:"Runs", funnel:"Run funnel", byRole:"Calls by role",
    council:"Council score", councilHint:"Your own blind votes decide whether the hive beats one model.",
    verdict:"Verdict", win:"SwarmAgentOS wins", loss:"Single model wins", tie:"Ties", councilStats:"Council totals",
    models:"Models", modelsHint:"Cost, calls and error rate per provider in the range.",
    runs:"Runs", runsHint:"Every run with an exportable receipt.",
    kRuns:"Runs", kComplete:"Completion", kSpend:"Spend", kCalls:"Model calls", kLat:"p50 latency", kWin:"Council win rate",
    empty:"No activity in this range", emptyHint:"Run an idea, or widen the range. Everything here is derived from your own runs — nothing is hardcoded.",
    planned:"Planned", executed:"Executed", reviewed:"Reviewed", synthesized:"Synthesized", created:"Created",
    provider:"Provider", calls:"Calls", cost:"Cost", tokens:"Tokens", errors:"Errors", errorRate:"Error rate", latency:"p50 latency",
    role:"Role", idea:"Idea", status:"Status", at:"Started", receipt:"Receipt",
    keep:"Keep the hive", simplify:"Back to one model", inProgress:"Collecting votes",
    roleOther:"other",
  },
  fr: {
    navOverview:"Vue d'ensemble", navCouncil:"Score du conseil", navModels:"Modèles", navRuns:"Lancements",
    overview:"Vue d'ensemble", spend:"Dépense (USD)", runs:"Lancements", funnel:"Entonnoir", byRole:"Appels par rôle",
    council:"Score du conseil", councilHint:"Vos votes à l'aveugle décident si la ruche bat un seul modèle.",
    verdict:"Verdict", win:"SwarmAgentOS gagne", loss:"Modèle seul gagne", tie:"Égalités", councilStats:"Totaux du conseil",
    models:"Modèles", modelsHint:"Coût, appels et taux d'erreur par fournisseur.",
    runs:"Lancements", runsHint:"Chaque lancement avec un reçu exportable.",
    kRuns:"Lancements", kComplete:"Terminés", kSpend:"Dépense", kCalls:"Appels modèle", kLat:"latence p50", kWin:"Taux de victoire",
    empty:"Aucune activité sur cette période", emptyHint:"Lancez une idée ou élargissez la période.",
    planned:"Planifiés", executed:"Exécutés", reviewed:"Relus", synthesized:"Synthétisés", created:"Créés",
    provider:"Fournisseur", calls:"Appels", cost:"Coût", tokens:"Jetons", errors:"Erreurs", errorRate:"Taux d'erreur", latency:"latence p50",
    role:"Rôle", idea:"Idée", status:"Statut", at:"Démarré", receipt:"Reçu",
    keep:"Garder la ruche", simplify:"Un seul modèle", inProgress:"Votes en cours",
    roleOther:"autre",
  },
  zh: {
    navOverview:"概览", navCouncil:"议会评分", navModels:"模型", navRuns:"运行记录",
    overview:"概览", spend:"花费 (USD)", runs:"运行数", funnel:"运行漏斗", byRole:"按角色调用",
    council:"议会评分", councilHint:"用你自己的盲测投票，决定蜂群是否胜过单模型。",
    verdict:"结论", win:"SwarmAgentOS 胜", loss:"单模型胜", tie:"平局", councilStats:"议会总计",
    models:"模型", modelsHint:"区间内每个 provider 的花费、调用与错误率。",
    runs:"运行记录", runsHint:"每次运行都有可导出的回执。",
    kRuns:"运行数", kComplete:"完成率", kSpend:"花费", kCalls:"模型调用", kLat:"p50 延迟", kWin:"议会胜率",
    empty:"该区间内暂无活动", emptyHint:"跑一个想法，或扩大区间。所有数据都来自你自己的运行，没有任何硬编码。",
    planned:"已规划", executed:"已执行", reviewed:"已评审", synthesized:"已合成", created:"已创建",
    provider:"Provider", calls:"调用", cost:"花费", tokens:"Token", errors:"错误", errorRate:"错误率", latency:"p50 延迟",
    role:"角色", idea:"想法", status:"状态", at:"开始", receipt:"回执",
    keep:"保留蜂群", simplify:"退回单模型", inProgress:"投票收集中",
    roleOther:"其他",
  },
};
let LANG = "en";
const t = k => (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;

function applyI18n(){
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const k = el.getAttribute("data-i18n");
    el.textContent = t(k);
  });
}

const fmtUSD = v => v == null ? "—" : "$" + Number(v).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:4});
const fmtInt = v => v == null ? "—" : Number(v).toLocaleString();
const fmtPct = v => v == null ? "—" : Math.round(v * 100) + "%";
const fmtMs = v => v == null ? "—" : Number(v).toLocaleString() + " ms";
function deltaHtml(v){
  if (v == null) return '<span class="k-delta flat">—</span>';
  const cls = v > 0 ? "up" : (v < 0 ? "down" : "flat");
  const arrow = v > 0 ? "▲" : (v < 0 ? "▼" : "▬");
  return `<span class="k-delta ${cls}">${arrow} ${Math.abs(Math.round(v*100))}%</span>`;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function el(tag, attrs, children){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) if (v != null) e.setAttribute(k, v);
  (children||[]).forEach(c => e.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
  return e;
}
function td(num, text, attrs){
  return el("td", {...(num?{class:"num num"}:{}), ...(attrs||{})}, [text]);
}

async function load(){
  const days = document.querySelector(".range button[aria-pressed='true']").dataset.days;
  const res = await fetch(`/analytics/summary?days=${days}`);
  const d = await res.json();
  const lang = (document.documentElement.lang || "en");
  if (I18N[lang]) LANG = lang;
  applyI18n();
  renderRange(d);
  renderKpis(d);
  renderChart(d.series);
  renderFunnel(d.stages);
  renderRoles(d.breakdowns.by_role);
  renderCouncil(d.overview.council);
  renderProviders(d.breakdowns.by_provider);
  renderRuns(d.receipts);
  document.querySelector("#overview").classList.toggle("has-data", !d.empty);
  if (d.empty){
    document.getElementById("kpis").innerHTML =
      `<div class="empty" style="grid-column:1/-1"><b>${t("empty")}</b><br>${t("emptyHint")}</div>`;
    ["chart","funnel"].forEach(id => document.getElementById(id).innerHTML = "");
  }
}

function renderRange(d){
  const {start,end,days} = d.range;
  document.getElementById("range-label").textContent = `${start} → ${end} · UTC`;
}
function renderKpis(d){
  const o = d.overview, dl = d.delta;
  const cards = [
    [t("kRuns"), fmtInt(o.runs), deltaHtml(dl.runs)],
    [t("kComplete"), fmtPct(o.completion_rate), deltaHtml(dl.completed)],
    [t("kSpend"), fmtUSD(o.spend_usd), deltaHtml(dl.spend_usd)],
    [t("kCalls"), fmtInt(o.model_calls), deltaHtml(dl.model_calls)],
    [t("kLat"), fmtMs(o.p50_latency_ms), ""],
    [t("kWin"), fmtPct(o.council.win_rate), deltaHtml(dl.council_votes)],
  ];
  document.getElementById("kpis").innerHTML = cards.map(c =>
    `<div class="kpi"><div class="k-label">${c[0]}</div><div class="k-value num">${c[1]}</div><div>${c[2]||""}</div></div>`).join("");
}

function renderChart(series){
  if (!series || !series.length){ document.getElementById("chart").innerHTML = ""; return; }
  const W = 720, H = 220, P = {l:44, r:14, t:14, b:28};
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const maxCost = Math.max(1, ...series.map(s => s.cost_usd || 0));
  const maxRuns = Math.max(1, ...series.map(s => s.runs || 0));
  const x = i => P.l + (series.length === 1 ? iw/2 : i * iw/(series.length-1));
  const yCost = v => P.t + ih - (v/maxCost)*ih;
  const yRuns = v => P.t + ih - (v/maxRuns)*ih;
  const linePts = series.map((s,i) => `${x(i)},${yCost(s.cost_usd)}`).join(" ");
  const areaPts = `M${x(0)},${P.t+ih} L` + series.map((s,i)=>`${x(i)},${yCost(s.cost_usd)}`).join(" L") + ` L${x(series.length-1)},${P.t+ih} Z`;
  const barW = Math.max(2, Math.min(18, iw/(series.length)*0.6));
  const bars = series.map((s,i)=>{
    const h = (s.runs/maxRuns)*ih;
    return `<rect x="${x(i)-barW/2}" y="${P.t+ih-h}" width="${barW}" height="${h}" fill="var(--lime)" stroke="var(--ink)" stroke-width="1"><title>${s.date} · ${s.runs} runs</title></rect>`;
  }).join("");
  const grid = [0,0.5,1].map(f=>{
    const y = P.t+ih-f*ih;
    return `<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="var(--mute)" stroke-width="1"/><text x="${P.l-6}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--soft)">${fmtUSD(f*maxCost)}</text>`;
  }).join("");
  const ticks = (series.length <= 10 ? series : series.filter((s,i)=>i % Math.ceil(series.length/8) === 0))
    .map((s,i)=>`<text x="${x(series.indexOf(s))}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--soft)">${s.date.slice(5)}</text>`).join("");
  document.getElementById("chart").innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="spend and runs">${grid}<path d="${areaPts}" fill="var(--flame)" opacity="0.14"/>${bars}<polyline points="${linePts}" fill="none" stroke="var(--flame)" stroke-width="2.5"/>${ticks}</svg>`;
}

function renderFunnel(stages){
  const max = Math.max(1, ...stages.map(s=>s.runs));
  const order = ["created","planned","executed","reviewed","synthesized"];
  document.getElementById("funnel").innerHTML = stages.map(s=>{
    const w = Math.round(s.runs/max*100);
    return `<div class="f-step"><span>${t(s.stage)}</span><div class="bar" style="width:${w}%"></div><span class="n num">${s.runs}</span></div>`;
  }).join("");
}

function renderRoles(roles){
  if (!roles || !roles.length){ document.getElementById("role-table").innerHTML = ""; return; }
  const head = `<thead><tr><th>${t("role")}</th><th class="num">${t("calls")}</th><th class="num">${t("cost")}</th></tr></thead>`;
  const body = roles.map(r=>`<tr><td>${esc(r.role)}</td><td class="num">${fmtInt(r.calls)}</td><td class="num">${fmtUSD(r.cost_usd)}</td></tr>`).join("");
  document.getElementById("role-table").innerHTML = head + `<tbody>${body}</tbody>`;
}

function renderCouncil(c){
  const verdict = document.getElementById("verdict");
  const v = c.verdict;
  const cls = v === "keep_multi_agent" ? "ok" : (v === "simplify" ? "bad" : "warn");
  const label = v === "keep_multi_agent" ? t("keep") : (v === "simplify" ? t("simplify") : t("inProgress"));
  verdict.innerHTML = `<span class="pill ${cls}">${label}</span>`;
  const total = Math.max(1, c.votes);
  const w = Math.round(c.wins/total*100), l = Math.round(c.losses/total*100), tt = 100-w-l;
  document.getElementById("winbar").innerHTML =
    `<div class="w" style="width:${w}%" title="${c.wins}"></div><div class="l" style="width:${l}%" title="${c.losses}"></div><div class="t" style="width:${tt}%" title="${c.ties}"></div>`;
  document.getElementById("council-stats").innerHTML =
    `<div class="num" style="font:600 1.6rem/1.2 var(--font-label)">${c.votes}<span style="font-size:.8rem;color:var(--soft)"> / 10</span></div>` +
    `<div style="margin-top:6px;font:400 .78rem/1.6 var(--font-label)">${t("win")}: <b>${c.wins}</b> · ${t("loss")}: <b>${c.losses}</b> · ${t("tie")}: <b>${c.ties}</b></div>`;
}

function renderProviders(providers){
  const head = `<thead><tr><th>${t("provider")}</th><th class="num">${t("calls")}</th><th class="num">${t("cost")}</th><th class="num">${t("tokens")}</th><th class="num">${t("errors")}</th><th class="num">${t("errorRate")}</th><th class="num">${t("latency")}</th></tr></thead>`;
  const body = providers.map(p=>`<tr><td>${esc(p.provider)}</td><td class="num">${fmtInt(p.calls)}</td><td class="num">${fmtUSD(p.cost_usd)}</td><td class="num">${fmtInt(p.tokens)}</td><td class="num">${fmtInt(p.errors)}</td><td class="num">${fmtPct(p.error_rate)}</td><td class="num">${fmtMs(p.p50_latency_ms)}</td></tr>`).join("");
  document.getElementById("provider-table").innerHTML = head + `<tbody>${body}</tbody>`;
}

function renderRuns(rows){
  const head = `<thead><tr><th>${t("idea")}</th><th>${t("status")}</th><th class="num">${t("cost")}</th><th>${t("at")}</th><th>${t("receipt")}</th></tr></thead>`;
  const body = rows.map(r=>{
    const cls = r.status === "completed" ? "ok" : (r.status === "failed" ? "bad" : "warn");
    const idea = document.createElement("div");
    idea.textContent = r.idea;
    return `<tr><td style="max-width:440px;overflow-wrap:anywhere">${idea.innerHTML}</td>` +
      `<td><span class="pill ${cls}">${esc(r.status)}</span></td>` +
      `<td class="num">${fmtUSD(r.cost_usd)}</td>` +
      `<td class="num">${esc(r.created_at.slice(0,10))}</td>` +
      `<td><a class="mono" href="/runs/${esc(r.run_id)}/receipt">json</a> · <a class="mono" href="/runs/${esc(r.run_id)}/receipt.md">md</a></td></tr>`;
  }).join("");
  document.getElementById("runs-table").innerHTML = head + `<tbody>${body}</tbody>`;
}

document.querySelectorAll(".range button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".range button").forEach(x => x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true");
  load();
}));
document.querySelectorAll(".rail a").forEach(a => a.addEventListener("click", () => {
  document.querySelectorAll(".rail a").forEach(x => x.classList.remove("active"));
  a.classList.add("active");
}));
load();
</script>
</body>
</html>
