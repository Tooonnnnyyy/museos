<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuseOS Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#11120f;--page:#fff;--paper:#f3efe3;--bone:#fffdf7;--lime:#d9ff43;--flame:#ff5a36;--violet:#b7a7ff;--mint:#75ded1;
  --soft:color-mix(in srgb,var(--ink) 68%,transparent);
  --font-text:"Manrope","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;--font-label:"DM Mono","PingFang SC",ui-monospace,monospace;
  --rule:2px solid var(--ink);--hair:1px solid color-mix(in srgb,var(--ink) 25%,transparent);--focus:var(--ink);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 1rem/1.5 var(--font-text);overflow-x:hidden}
h1,h2{margin:0;font-weight:500;text-wrap:balance}p{margin:0}a{color:inherit}button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
.wrap{width:min(100% - 40px,1240px);margin-inline:auto}
.band{padding-block:64px;border-bottom:var(--rule)}
.band--paper{background:var(--paper)}.band--violet{background:var(--violet)}.band--bone{background:var(--bone)}
.band--ink{background:var(--ink);color:var(--bone);--focus:var(--lime);--soft:color-mix(in srgb,var(--bone) 72%,transparent);--hair:1px solid color-mix(in srgb,var(--bone) 28%,transparent)}
.label{font:400 .78rem/1.5 var(--font-label)}
.eyebrow{font:400 .78rem/1.5 var(--font-label);text-transform:uppercase;letter-spacing:.08em;margin:0 0 14px}
.t-hero{font-size:clamp(2.6rem,6vw,4.8rem);line-height:1;letter-spacing:-.038em}
.t-h2{font-size:clamp(2rem,4vw,3.4rem);line-height:1;letter-spacing:-.038em;margin-bottom:28px}
.soft{color:var(--soft)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px;border-bottom:var(--rule)}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;text-decoration:none}
.mark{width:34px;height:34px;display:grid;place-items:center;background:var(--lime);border:var(--rule);transform:rotate(-4deg);font-weight:500;line-height:1}
.nav__links{display:flex;align-items:center;gap:18px}
.nav__links a{font:400 .8rem/1.5 var(--font-label);text-decoration:none}
.nav__links a:hover{text-decoration:underline;text-underline-offset:4px}
.lang{flex:none;display:inline-flex;border:var(--rule);border-radius:999px;overflow:hidden}
.lang button{padding:5px 11px;border:0;border-right:var(--rule);background:var(--page);font:400 .72rem/1.5 var(--font-label);cursor:pointer}
.lang button:last-child{border-right:0}.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bone)}
.hero{padding:48px 0 44px;border-bottom:var(--rule)}
.hero p{margin-top:14px;max-width:60ch;font-size:1.1rem}
.strip{background:var(--lime);border-bottom:var(--rule);padding-block:22px}
.cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:var(--rule);background:var(--bone)}
.cells>div{padding:14px 10px;text-align:center;border-right:var(--rule);min-width:0}.cells>div:last-child{border-right:0}
.cells b{display:block;font:500 clamp(1.3rem,2.6vw,2.4rem)/1 var(--font-label);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cells span{display:block;margin-top:6px;font:400 .6875rem/1.3 var(--font-label);letter-spacing:.06em}
.scroll{overflow-x:auto;border:var(--rule);background:var(--bone)}
table{width:100%;border-collapse:collapse;min-width:820px}
th{font:400 .72rem/1.4 var(--font-label);text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:12px 14px;border-bottom:var(--rule);white-space:nowrap}
td{padding:12px 14px;border-bottom:var(--hair);vertical-align:top;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.name{font-weight:500}.sub{font:400 .72rem/1.5 var(--font-label);color:var(--soft);overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border:var(--rule);border-radius:999px;font:400 .7rem/1.5 var(--font-label);text-transform:uppercase;letter-spacing:.05em;background:var(--page);white-space:nowrap}
.pill.ok{background:var(--lime)}.pill.bad{background:var(--flame)}.pill.off{background:var(--paper)}
.btn{padding:4px 12px;border:var(--rule);border-radius:999px;background:var(--ink);color:var(--bone);font:400 .7rem/1.5 var(--font-label);cursor:pointer;box-shadow:3px 3px 0 var(--flame)}
.bars{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:8px;align-items:end;height:220px;border-bottom:2px solid var(--bone);padding-top:10px}
.bar{position:relative;background:var(--lime);min-height:2px}
.bar i{position:absolute;left:0;right:0;bottom:calc(100% + 6px);text-align:center;font:400 .625rem/1.2 var(--font-label);font-style:normal;color:var(--bone);white-space:nowrap}
.days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:8px;margin-top:8px}
.days span{text-align:center;font:400 .625rem/1.3 var(--font-label);color:var(--soft)}
.list{border-top:var(--rule)}
.item{display:grid;grid-template-columns:150px 170px 1fr;gap:14px;padding:12px 0;border-bottom:var(--hair);font-size:.95rem}
.item span:first-child,.item span:nth-child(2){font:400 .72rem/1.7 var(--font-label)}
.item span:last-child{overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));border-top:var(--rule);border-left:var(--rule);background:var(--page)}
.kv>div{padding:16px;border-right:var(--rule);border-bottom:var(--rule);min-width:0}
.kv b{display:block;margin-top:6px;font-weight:500;font-size:1.15rem;overflow-wrap:anywhere}
.foot{padding:24px 0;background:var(--ink);color:var(--bone);font:400 .72rem/1.6 var(--font-label);text-transform:uppercase;letter-spacing:.06em}
@media (max-width:820px){.cells{grid-template-columns:repeat(2,1fr)}.cells>div{border-bottom:var(--rule)}.cells>div:nth-child(2n){border-right:0}.cells>div:last-child{grid-column:1/-1;border-bottom:0}
  .item{grid-template-columns:1fr}.band{padding-block:48px}.bar i{display:none}}
@media (max-width:520px){.wrap{width:calc(100% - 32px)}.nav__links a:not(.keep){display:none}.nav__links{gap:10px}.days span:nth-child(odd){visibility:hidden}}
</style>
</head>
<body>
<div class="wrap"><nav class="nav" aria-label="Main">
  <a class="brand" href="/"><span class="mark">M</span><span>MuseOS</span></a>
  <div class="nav__links">
    <a href="/" class="keep" data-i18n="back"></a>
    <span class="lang keep" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="fr">FR</button><button type="button" data-lang="zh">中文</button>
    </span>
  </div>
</nav></div>

<header class="hero"><div class="wrap">
  <p class="eyebrow" data-i18n="eyebrow"></p>
  <h1 class="t-hero" data-i18n="title"></h1>
  <p data-i18n="intro"></p>
</div></header>

<section class="strip"><div class="wrap"><div class="cells" id="totals"></div></div></section>

<section class="band band--paper"><div class="wrap">
  <h2 class="t-h2" data-i18n="modelsTitle"></h2>
  <div class="scroll"><table><thead><tr id="phead"></tr></thead><tbody id="pbody"></tbody></table></div>
</div></section>

<section class="band band--ink"><div class="wrap">
  <h2 class="t-h2" data-i18n="daysTitle"></h2>
  <div class="bars" id="bars" role="img"></div><div class="days" id="days"></div>
  <p class="label soft" style="margin-top:16px" id="daysnote"></p>
</div></section>

<section class="band band--violet"><div class="wrap">
  <h2 class="t-h2" data-i18n="failTitle"></h2>
  <div class="list" id="failures"></div>
</div></section>

<section class="band band--bone"><div class="wrap">
  <h2 class="t-h2" data-i18n="setTitle"></h2>
  <div class="kv" id="settings"></div>
</div></section>

<footer class="foot"><div class="wrap" data-i18n="footer"></div></footer>

<script>
const I18N = {
en: {
  back: "← Command Center", eyebrow: "Admin · this machine only", title: "What MuseOS has been doing.",
  intro: "Usage, cost and health for every model you connected. Read-only, except for retrying a paused model. Keys are shown only as present or missing.",
  tRuns: "Runs", tCalls: "Model calls", tFailed: "Failed calls", tCost: "Spent", tTokens: "Tokens",
  modelsTitle: "Models", hModel: "Model", hState: "State", hKey: "Key", hCalls: "Calls", hFail: "Failed", h24: "Last 24 h", hLatency: "Avg time", hTokens: "Tokens", hCost: "Cost", hCaps: "Limits",
  on: "On", off: "Off", paused: "Paused", removed: "Removed", keySet: "Present", keyMissing: "Missing", keyNone: "Not needed", retry: "Retry now",
  kindSub: "Subscription", kindMock: "Demo", kindApi: "API", capNone: "none", capFmt: "{0} at a time · {1}/run · {2}/day",
  daysTitle: "Last 14 days", daysNote: "Bar height is spend per day. {0} runs and {1} model calls in this period.", noSpend: "No spend recorded in this period.",
  failTitle: "Recent failed calls", noFail: "No failed calls. ", denials: "Calls refused by policy: {0}",
  setTitle: "Settings", sVersion: "Version", sDb: "Database", sFile: "Provider file", sBudget: "Highest budget per run", sHosts: "Answers to", sWrites: "External actions", sLogin: "Login", sBlind: "Blind test",
  disabled: "Disabled", enabled: "Enabled", noLogin: "None: local use only", blindFmt: "{0} of {1} votes · MuseOS {2}, one model {3}",
  footer: "MuseOS admin · local only · change settings in .env and providers.toml, then restart", loadFail: "Could not load the numbers."
},
fr: {
  back: "← Command Center", eyebrow: "Administration · cette machine uniquement", title: "Ce que MuseOS a fait.",
  intro: "Utilisation, coût et état de chaque modèle connecté. Lecture seule, sauf pour relancer un modèle en pause. Les clés sont seulement indiquées comme présentes ou absentes.",
  tRuns: "Exécutions", tCalls: "Appels aux modèles", tFailed: "Appels échoués", tCost: "Dépensé", tTokens: "Tokens",
  modelsTitle: "Modèles", hModel: "Modèle", hState: "État", hKey: "Clé", hCalls: "Appels", hFail: "Échecs", h24: "24 h", hLatency: "Durée moy.", hTokens: "Tokens", hCost: "Coût", hCaps: "Limites",
  on: "Actif", off: "Inactif", paused: "En pause", removed: "Retiré", keySet: "Présente", keyMissing: "Absente", keyNone: "Inutile", retry: "Relancer",
  kindSub: "Abonnement", kindMock: "Démo", kindApi: "API", capNone: "aucune", capFmt: "{0} à la fois · {1}/exécution · {2}/jour",
  daysTitle: "14 derniers jours", daysNote: "La hauteur des barres indique la dépense par jour. {0} exécutions et {1} appels sur la période.", noSpend: "Aucune dépense sur la période.",
  failTitle: "Appels échoués récents", noFail: "Aucun appel échoué. ", denials: "Appels refusés par les règles : {0}",
  setTitle: "Réglages", sVersion: "Version", sDb: "Base de données", sFile: "Fichier des modèles", sBudget: "Budget maximal par exécution", sHosts: "Répond à", sWrites: "Actions externes", sLogin: "Connexion", sBlind: "Test à l'aveugle",
  disabled: "Désactivées", enabled: "Activées", noLogin: "Aucune : usage local uniquement", blindFmt: "{0} votes sur {1} · MuseOS {2}, modèle seul {3}",
  footer: "Administration MuseOS · local uniquement · modifiez .env et providers.toml puis redémarrez", loadFail: "Impossible de charger les chiffres."
},
zh: {
  back: "← Command Center", eyebrow: "后台 · 仅限本机", title: "MuseOS 都做了什么。",
  intro: "你接入的每个模型的用量、费用和状态。只读，只有「重试暂停的模型」可以操作。Key 只显示有或没有。",
  tRuns: "运行次数", tCalls: "模型调用", tFailed: "失败调用", tCost: "已花费", tTokens: "Tokens",
  modelsTitle: "模型", hModel: "模型", hState: "状态", hKey: "Key", hCalls: "调用", hFail: "失败", h24: "近 24 小时", hLatency: "平均用时", hTokens: "Tokens", hCost: "费用", hCaps: "限制",
  on: "启用", off: "停用", paused: "暂停", removed: "已移除", keySet: "已配置", keyMissing: "缺失", keyNone: "不需要", retry: "立即重试",
  kindSub: "订阅", kindMock: "演示", kindApi: "API", capNone: "无", capFmt: "一次 {0} 个 · 每次运行 {1} · 每天 {2}",
  daysTitle: "最近 14 天", daysNote: "柱高是每天的花费。这段时间共 {0} 次运行、{1} 次模型调用。", noSpend: "这段时间没有花费记录。",
  failTitle: "最近失败的调用", noFail: "没有失败的调用。", denials: "被策略拒绝的调用：{0}",
  setTitle: "设置", sVersion: "版本", sDb: "数据库", sFile: "模型配置文件", sBudget: "单次运行预算上限", sHosts: "只响应", sWrites: "对外操作", sLogin: "登录", sBlind: "盲测",
  disabled: "关闭", enabled: "开启", noLogin: "无：仅限本机使用", blindFmt: "已投 {0} / {1} · MuseOS {2} 胜，单模型 {3} 胜",
  footer: "MuseOS 后台 · 仅限本机 · 修改 .env 和 providers.toml 后重启生效", loadFail: "数据加载失败。"
}};
const LANGS = ["en", "fr", "zh"];
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const guess = () => { const n = (navigator.language || "en").toLowerCase(); return n.startsWith("zh") ? "zh" : n.startsWith("fr") ? "fr" : "en"; };
let lang = LANGS.includes(store.get("museos.lang")) ? store.get("museos.lang") : guess(), data = null;
const t = (key, ...args) => { let s = I18N[lang][key] ?? I18N.en[key] ?? key; args.forEach((v, i) => { s = s.split("{" + i + "}").join(v); }); return s; };
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const money = v => "$" + (v < 1 ? v.toFixed(4) : v.toFixed(2));
const n = v => Number(v).toLocaleString();

function render() {
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
  document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  if (!data) return;
  const T = data.totals, tot = $("totals"); tot.replaceChildren();
  [[n(T.runs), "tRuns"], [n(T.model_calls), "tCalls"], [n(T.failed_calls), "tFailed"], [money(T.cost_usd), "tCost"], [n(T.tokens), "tTokens"]].forEach(([v, k]) => {
    const c = el("div"); c.append(el("b", null, v), el("span", null, t(k))); tot.append(c);
  });

  const head = $("phead"); head.replaceChildren();
  [["hModel"], ["hState"], ["hKey"], ["hCalls", 1], ["hFail", 1], ["h24", 1], ["hLatency", 1], ["hTokens", 1], ["hCost", 1], ["hCaps"]].forEach(([k, num]) => head.append(el("th", num ? "num" : null, t(k))));
  const body = $("pbody"); body.replaceChildren();
  data.providers.forEach(p => {
    const tr = el("tr"), name = el("td");
    name.append(el("div", "name", p.display_name), el("div", "sub", (p.adapter === "removed" ? t("removed") : p.subscription ? t("kindSub") : p.adapter === "mock" ? t("kindMock") : t("kindApi")) + (p.model ? " · " + p.model : "")));
    const state = el("td");
    if (p.adapter === "removed") state.append(el("span", "pill off", t("removed")));
    else if (!p.enabled) state.append(el("span", "pill off", t("off")));
    else if (p.healthy) state.append(el("span", "pill ok", t("on")));
    else {
      state.append(el("span", "pill bad", t("paused")));
      const b = el("button", "btn", t("retry")); b.type = "button"; b.style.marginLeft = "8px";
      b.onclick = async () => { await fetch("/admin/providers/" + encodeURIComponent(p.id) + "/reset", {method: "POST"}); load(); };
      state.append(b);
    }
    const key = el("td"); key.append(el("span", "pill " + (p.key === "missing" ? "bad" : p.key === "set" ? "ok" : "off"), p.key === "missing" ? t("keyMissing") : p.key === "set" ? t("keySet") : t("keyNone")));
    const caps = p.max_calls_per_run == null && p.max_calls_per_day == null ? t("capNone") : t("capFmt", p.max_concurrency ?? "–", p.max_calls_per_run ?? "–", p.max_calls_per_day ?? "–");
    tr.append(name, state, key, el("td", "num", n(p.attempts)), el("td", "num", n(p.failed)), el("td", "num", n(p.calls_24h)),
      el("td", "num", p.attempts ? (p.avg_latency_ms / 1000).toFixed(1) + " s" : "–"), el("td", "num", n(p.input_tokens + p.output_tokens)), el("td", "num", money(p.cost_usd)), el("td", "sub", caps));
    body.append(tr);
  });

  const max = Math.max(...data.by_day.map(d => d.cost_usd), 0), bars = $("bars"), days = $("days");
  bars.replaceChildren(); days.replaceChildren();
  data.by_day.forEach(d => {
    const b = el("div", "bar"); b.style.height = max ? Math.max(d.cost_usd / max * 100, d.cost_usd ? 2 : 0) + "%" : "0";
    if (d.cost_usd) b.append(el("i", null, money(d.cost_usd)));
    b.title = d.date + " · " + money(d.cost_usd); bars.append(b); days.append(el("span", null, d.date.slice(5)));
  });
  const sum = (k) => data.by_day.reduce((a, d) => a + d[k], 0);
  bars.setAttribute("aria-label", t("daysTitle"));
  $("daysnote").textContent = (max ? "" : t("noSpend") + " ") + t("daysNote", n(sum("runs")), n(sum("calls")));

  const f = $("failures"); f.replaceChildren();
  data.failures.forEach(x => {
    const row = el("div", "item"); row.append(el("span", null, x.at.slice(0, 16).replace("T", " ")), el("span", null, x.provider + " · " + x.task), el("span", null, x.error || x.status)); f.append(row);
  });
  const dn = el("p", "label", (data.failures.length ? "" : t("noFail")) + t("denials", n(data.denials.total) + (data.denials.total ? " (" + Object.entries(data.denials.by_rule).map(([k, v]) => k + " " + v).join(", ") + ")" : "")));
  dn.style.marginTop = "16px"; f.append(dn);

  const S = data.settings, B = data.blind_test, kv = $("settings"); kv.replaceChildren();
  [["sVersion", S.version], ["sDb", S.database], ["sFile", S.providers_file], ["sBudget", "$" + S.max_budget_usd], ["sHosts", S.allowed_hosts.join(", ")],
   ["sWrites", S.external_writes_enabled ? t("enabled") : t("disabled")], ["sLogin", t("noLogin")], ["sBlind", t("blindFmt", B.voted, B.target, B.museos_wins, B.baseline_wins)]].forEach(([k, v]) => {
    const c = el("div"); c.append(el("span", "label", t(k)), el("b", null, String(v))); kv.append(c);
  });
}
async function load() {
  try { data = await (await fetch("/admin/summary")).json(); render(); }
  catch (e) { $("totals").replaceChildren(el("div", null, t("loadFail"))); }
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set("museos.lang", lang); render(); });
render(); load(); setInterval(load, 15000);
</script>
</body>
</html>
